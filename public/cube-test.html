<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cube CDN Test</title>
  <style>
    body { margin: 0; background: #09090b; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; font-family: sans-serif; color: white; }
    #status { font-size: 14px; color: #a1a1aa; margin-bottom: 16px; }
    #container { width: 500px; height: 500px; }
    twisty-player { width: 100%; height: 100%; display: block; }
  </style>
</head>
<body>
  <div id="status">Loading cube from CDN...</div>
  <div id="container"></div>
  <script type="module">
    try {
      const { TwistyPlayer } = await import("https://cdn.cubing.net/v0/js/cubing/twisty");
      document.getElementById("status").textContent = "Cube loaded via CDN";

      const player = new TwistyPlayer({
        puzzle: "3x3x3",
        visualization: "PG3D",
        experimentalDragInput: "auto",
        controlPanel: "none",
        background: "none",
        hintFacelets: "none",
      });

      document.getElementById("container").appendChild(player);
    } catch (e) {
      document.getElementById("status").textContent = "ERROR: " + e.message;
    }
  </script>
</body>
</html>
